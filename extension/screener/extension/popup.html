<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screener Bot Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #238636;
      color: #ffffff;
      font-weight: 600;
    }
    .badge-offline {
      background: #da3633;
    }
    .status-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .status-label {
      color: #8b949e;
    }
    .status-val {
      font-weight: 600;
      color: #f0f6fc;
    }
    .btn {
      width: 100%;
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      color: #ffffff;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #2ea043;
    }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border-color: #30363d;
    }
    .btn-secondary:hover {
      background: #30363d;
      color: #ffffff;
    }
    .btn:disabled {
      background: #21262d;
      color: #8b949e;
      cursor: not-allowed;
    }
    .log-box {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      background: #090d13;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      color: #8b949e;
      min-height: 44px;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>📊</span> Screener Bot Bridge
    </div>
    <div id="serverBadge" class="badge badge-offline">CONNECTING</div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Server (Port 8776):</span>
      <span id="serverStatus" class="status-val">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Pinned Tab:</span>
      <span id="tabStatus" class="status-val">Searching...</span>
    </div>
    <div class="status-row" style="margin-bottom: 0;">
      <span class="status-label">Last Capture:</span>
      <span id="lastCapture" class="status-val">—</span>
    </div>
  </div>

  <button id="extractActiveBtn" class="btn">⚡ Extract Active Screener Tab</button>
  <button id="queueFnoBtn" class="btn btn-secondary">🔍 Queue F&O Leaders Screen</button>
  <button id="queueEarningsBtn" class="btn btn-secondary">🚀 Queue Earnings Acceleration</button>

  <div id="logBox" class="log-box">Extension ready. Make sure a Screener.in tab is open.</div>

  <script src="popup.js"></script>
</body>
</html>
